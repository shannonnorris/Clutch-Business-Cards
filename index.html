<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Clutch Business Card Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f0edf7;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    font-family: "DM Sans", sans-serif;
    padding: 40px 20px;
    gap: 28px;
  }

  h1 {
    font-family: "Playfair Display", serif;
    font-size: 22px;
    color: #1e1030;
    letter-spacing: 0.02em;
  }
  h1 span { color: #7c3aed; }

  .form-card {
    background: #fff;
    border-radius: 14px;
    padding: 28px 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 30px rgba(90,50,130,0.1), 0 0 0 1px rgba(160,110,210,0.1);
  }

  .form-card h2 {
    font-size: 11px;
    font-weight: 500;
    color: #7c3aed;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }

  .field label {
    font-size: 10px;
    font-weight: 500;
    color: #9b89b4;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .field input {
    border: 1px solid #e2d9f3;
    border-radius: 7px;
    padding: 9px 12px;
    font-size: 13px;
    font-family: "DM Sans", sans-serif;
    color: #1e1030;
    outline: none;
    transition: border-color 0.2s;
    background: #faf9fc;
  }

  .field input:focus { border-color: #a855f7; background: #fff; }
  .field input::placeholder { color: #c4b5d8; }

  .field input[readonly] {
    background: #f3f0fa;
    color: #9b89b4;
    cursor: default;
  }

  .btn-row { display: flex; gap: 10px; margin-top: 6px; }

  .btn {
    flex: 1;
    padding: 11px;
    border: none;
    border-radius: 8px;
    font-family: "DM Sans", sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }

  .btn-primary {
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    color: #fff;
  }

  .btn-dl {
    background: #1e1030;
    color: #d8b4fe;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-dl svg { width: 13px; height: 13px; fill: #d8b4fe; flex-shrink: 0; }

  .section-label {
    color: #9b89b4;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    align-self: flex-start;
    max-width: 760px;
    width: 100%;
  }

  .cards-row {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .card-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .side-label {
    color: #9b89b4;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  /* CARD */
  .card {
    width: 336px;
    height: 192px;
    border-radius: 10px;
    position: relative;
    overflow: hidden;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
    cursor: default;
    flex-shrink: 0;
  }

  .card:hover { transform: translateY(-5px) rotate(-0.4deg); }

  .front {
    background: #ffffff;
    box-shadow: 0 20px 50px rgba(90,50,130,0.13), 0 0 0 1px rgba(160,110,210,0.12);
  }
  .front:hover { box-shadow: 0 36px 65px rgba(90,50,130,0.2), 0 0 0 1px rgba(150,100,200,0.15); }

  .accent-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3.5px;
    background: linear-gradient(90deg, #7c3aed 0%, #a855f7 55%, #d8b4fe 100%);
  }

  .front::before {
    content: "";
    position: absolute;
    top: -50px; right: -50px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(168,85,247,0.1) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .front-content {
    position: relative;
    z-index: 2;
    padding: 22px 24px 18px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .card-name {
    font-family: "Playfair Display", serif;
    font-size: 21px;
    font-weight: 600;
    color: #1e1030;
    line-height: 1.1;
  }

  .card-title {
    font-size: 9px;
    font-weight: 500;
    color: #7c3aed;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 5px;
  }

  .logo-area {
    position: absolute;
    top: 14px; right: 18px;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .logo-area img {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: block;
    object-fit: cover;
  }

  .brand-name {
    font-size: 12px;
    font-weight: 500;
    color: #5b2fa0;
    letter-spacing: 0.07em;
  }

  .contact-block { display: flex; flex-direction: column; gap: 4px; }
  .contact-row { display: flex; align-items: center; gap: 7px; }
  .contact-icon { width: 11px; text-align: center; flex-shrink: 0; }
  .contact-icon svg { width: 10px; height: 10px; fill: #a855f7; vertical-align: middle; }

  .contact-text {
    font-size: 8.5px;
    color: #6b5a8a;
    letter-spacing: 0.04em;
    font-weight: 300;
  }

  /* BACK */
  .back {
    background: #1e1030;
    box-shadow: 0 20px 50px rgba(30,10,60,0.3), 0 0 0 1px rgba(120,60,200,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .back:hover { box-shadow: 0 40px 70px rgba(30,10,60,0.4); }

  .back::before {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 250px; height: 250px;
    background: radial-gradient(circle, rgba(168,85,247,0.2) 0%, transparent 65%);
    border-radius: 50%;
    pointer-events: none;
  }

  .back .accent-bar {
    background: linear-gradient(90deg, #7c3aed 0%, #a855f7 55%, transparent 100%);
  }

  .back-bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3.5px;
    background: linear-gradient(90deg, transparent 0%, #7c3aed 45%, #a855f7 100%);
  }

  .back-logo {
    position: relative;
    z-index: 2;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .back-logo img {
    width: 58px; height: 58px;
    border-radius: 50%;
    display: block;
    object-fit: cover;
    box-shadow: 0 0 28px rgba(168,85,247,0.4);
    filter: brightness(1.1);
  }

  .back-tagline {
    font-size: 8px;
    color: #7c5ab8;
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  .hint {
    color: #b8a8d0;
    font-size: 10px;
    text-align: center;
    line-height: 1.7;
  }

  #dl-status {
    font-size: 11px;
    color: #7c3aed;
    min-height: 16px;
    text-align: center;
  }
</style>
</head>

<h1><span>clutch</span> · Business Card Generator</h1>

<div class="form-card">
  <h2>Your Details</h2>
  <div class="field">
    <label>Full Name</label>
    <input type="text" id="inp-name" placeholder="e.g. Jane Smith" oninput="update()">
  </div>
  <div class="field">
    <label>Job Title</label>
    <input type="text" id="inp-title" placeholder="e.g. Account Executive" oninput="update()">
  </div>
  <div class="field">
    <label>Phone</label>
    <input type="text" id="inp-phone" placeholder="e.g. (201) 400-3930" oninput="update()">
  </div>
  <div class="field">
    <label>Email</label>
    <input type="text" id="inp-email" placeholder="e.g. name@withclutch.com" oninput="update()">
  </div>
  <div class="field">
    <label>LinkedIn (short)</label>
    <input type="text" id="inp-linkedin" placeholder="e.g. linkedin.com/in/yourname" oninput="update()">
  </div>
  <div class="field">
    <label>Website</label>
    <input type="text" id="inp-web" value="withclutch.com" readonly>
  </div>

  <div id="dl-status"></div>

  <div class="btn-row">
    <button class="btn btn-dl" onclick="downloadCard('front')">
      <svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-7 4h14v-2H5v2z"/></svg>

    <button class="btn btn-dl" onclick="downloadCard('back')">

      Back JPEG
    </button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  function update() {
    var name     = document.getElementById("inp-name").value.trim();
    var title    = document.getElementById("inp-title").value.trim();
    var phone    = document.getElementById("inp-phone").value.trim();
    var email    = document.getElementById("inp-email").value.trim();
    var linkedin = document.getElementById("inp-linkedin").value.trim();

    document.getElementById("preview-name").textContent     = name     || "Your Name";
    document.getElementById("preview-title").textContent    = title    || "Your Title";
    document.getElementById("preview-phone").textContent    = phone    || "—";
    document.getElementById("preview-email").textContent    = email    || "—";
    document.getElementById("preview-linkedin").textContent = linkedin || "—";
  }

  function downloadCard(side) {
    var el = document.getElementById("card-" + side);
    var status = document.getElementById("dl-status");
    status.textContent = "Rendering…";

    // Temporarily remove hover transform so capture is clean
    el.style.transform = "none";
    el.style.transition = "none";

    var name = document.getElementById("inp-name").value.trim() || "card";
    var filename = name.toLowerCase().replace(/\s+/g, "_") + "_" + side + ".jpg";

    html2canvas(el, {
      scale: 3,
      useCORS: true,
      backgroundColor: null,
      logging: false
    }).then(function(canvas) {
      el.style.transform = "";
      el.style.transition = "";
      status.textContent = "";

      var link = document.createElement("a");
      link.download = filename;
      link.href = canvas.toDataURL("image/jpeg", 0.97);
      link.click();
    }).catch(function(err) {
      el.style.transform = "";
      el.style.transition = "";
      status.textContent = "Error rendering — try again.";
      console.error(err);
    });
  }
</script>
